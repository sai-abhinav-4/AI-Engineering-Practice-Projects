services:
  app:
    build: .
    container_name: notesgpt-app
    ports:
      - "8000:8000"          # host port 8000 -> app's 8000
    env_file: .env           # secrets injected at RUNTIME, never baked into the image
    environment:
      - CHROMA_HOST=chroma   # <- the SERVICE NAME below, not an IP address
      - CHROMA_PORT=8000     # <- chroma's INTERNAL port (not the published 8001)
      - ANONYMIZED_TELEMETRY=False
    depends_on:
      - chroma
    restart: unless-stopped  # if it does crash, Docker brings it back

  chroma:
    image: chromadb/chroma:0.6.3
    container_name: notesgpt-chroma
    ports:
      - "8001:8000"          # published so you can access chroma from the host
    volumes:
      - chroma_data:/chroma/chroma   # the persistent volume - data survives container restarts
    restart: unless-stopped

volumes:
  chroma_data:
